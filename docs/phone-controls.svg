<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7cf0ff"/>
    </marker>
    <marker id="ahY" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd166"/>
    </marker>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a07a"/><stop offset=".5" stop-color="#ecbd98"/><stop offset="1" stop-color="#d49b75"/>
    </linearGradient>
    <radialGradient id="knob" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#f4f7fa"/><stop offset=".6" stop-color="#9aa3ad"/><stop offset="1" stop-color="#5d646c"/>
    </radialGradient>
    <radialGradient id="scope" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1a0607"/><stop offset=".45" stop-color="#5a1c1e"/><stop offset=".85" stop-color="#b0605a"/><stop offset="1" stop-color="#3a1214"/>
    </radialGradient>
  </defs>

  <rect width="900" height="540" rx="18" fill="#0c1117"/>

  <!-- ===== phone + hand ===== -->
  <!-- long axis -->
  <line x1="230" y1="30" x2="230" y2="505" stroke="#6b7c8d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="240" y="500" fill="#6b7c8d" font-size="12">long axis</text>

  <!-- twist arrow: back half dashed, front half solid -->
  <path d="M325 62 A 95 20 0 0 0 135 62" fill="none" stroke="#7cf0ff" stroke-width="2.5" stroke-dasharray="5 6" opacity=".5"/>
  <path d="M135 62 A 95 20 0 0 0 325 62" fill="none" stroke="#7cf0ff" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- palm & wrist (behind the phone) -->
  <path d="M138 540 L140 470 C 128 420, 135 372, 168 345 L 296 345 C 326 362, 334 420, 326 470 L 324 540 Z" fill="url(#skin)" stroke="#a8724f" stroke-width="2"/>

  <!-- phone -->
  <rect x="165" y="95" width="130" height="350" rx="20" fill="#05070a" stroke="#3a4654" stroke-width="3"/>
  <rect x="173" y="110" width="114" height="320" rx="13" fill="#0d1218"/>
  <!-- status bar -->
  <circle cx="186" cy="124" r="3.5" fill="#3ef07a"/>
  <rect x="194" y="121" width="46" height="6" rx="3" fill="#2a3542"/>
  <!-- roll dial -->
  <circle cx="214" cy="250" r="17" fill="#1b0c0e" stroke="#2a3542" stroke-width="2"/>
  <path d="M214 235 l-5 -8 h10 z" fill="#e8eef4" transform="rotate(-25 214 250)"/>
  <rect x="201" y="278" width="26" height="11" rx="4" fill="#1a222c"/>
  <!-- lever track + knob -->
  <rect x="242" y="150" width="34" height="250" rx="17" fill="#0f1a22" stroke="#24313d" stroke-width="2"/>
  <line x1="246" y1="275" x2="272" y2="275" stroke="#24313d" stroke-width="2"/>
  <circle cx="259" cy="300" r="14" fill="url(#knob)"/>

  <!-- fingertips wrapping round the left edge -->
  <g fill="url(#skin)" stroke="#a8724f" stroke-width="2">
    <rect x="144" y="190" width="31" height="32" rx="15"/>
    <rect x="142" y="230" width="34" height="34" rx="16"/>
    <rect x="143" y="272" width="33" height="33" rx="15"/>
    <rect x="146" y="313" width="29" height="30" rx="14"/>
  </g>

  <!-- thumb on the lever -->
  <path d="M318 455 C 322 400, 296 350, 266 318" fill="none" stroke="#a8724f" stroke-width="35" stroke-linecap="round"/>
  <path d="M318 455 C 322 400, 296 350, 266 318" fill="none" stroke="#e8b38e" stroke-width="31" stroke-linecap="round"/>
  <ellipse cx="264" cy="318" rx="9" ry="11" fill="#f3d2bb" opacity=".85" transform="rotate(-40 264 318)"/>

  <!-- lever arrows -->
  <line x1="362" y1="262" x2="362" y2="192" stroke="#ffd166" stroke-width="3" marker-end="url(#ahY)"/>
  <line x1="362" y1="318" x2="362" y2="388" stroke="#ffd166" stroke-width="3" marker-end="url(#ahY)"/>

  <!-- labels -->
  <text x="352" y="58" fill="#e6edf3" font-size="19" font-weight="600">Twist</text>
  <text x="352" y="80" fill="#9fb0c0" font-size="15">around the long axis → rotate the scope</text>

  <text x="380" y="214" fill="#e6edf3" font-size="17" font-weight="600">Thumb up</text>
  <text x="380" y="235" fill="#9fb0c0" font-size="15">→ tip flexes down</text>
  <text x="380" y="360" fill="#e6edf3" font-size="17" font-weight="600">Thumb down</text>
  <text x="380" y="381" fill="#9fb0c0" font-size="15">→ tip flexes up</text>
  <text x="380" y="285" fill="#6b7c8d" font-size="13">lever position = tip angle</text>
  <text x="380" y="303" fill="#6b7c8d" font-size="13">let go → tip straightens</text>

  <!-- ===== laptop keys ===== -->
  <line x1="610" y1="120" x2="610" y2="470" stroke="#1f2a36" stroke-width="2"/>
  <text x="650" y="150" fill="#6b7c8d" font-size="12" letter-spacing="2">ON THE LAPTOP</text>
  <g font-weight="700" font-size="26" text-anchor="middle">
    <rect x="650" y="172" width="64" height="60" rx="10" fill="#1a222c" stroke="#2a3542" stroke-width="2"/>
    <rect x="650" y="226" width="64" height="6" rx="3" fill="#2a3542"/>
    <text x="682" y="212" fill="#dfe8f0">W</text>
    <rect x="650" y="252" width="64" height="60" rx="10" fill="#1a222c" stroke="#2a3542" stroke-width="2"/>
    <rect x="650" y="306" width="64" height="6" rx="3" fill="#2a3542"/>
    <text x="682" y="292" fill="#dfe8f0">S</text>
  </g>
  <text x="730" y="208" fill="#e6edf3" font-size="17" font-weight="600">Advance</text>
  <text x="730" y="288" fill="#e6edf3" font-size="17" font-weight="600">Withdraw</text>

  <!-- tiny scope view -->
  <circle cx="712" cy="400" r="50" fill="url(#scope)" stroke="#000" stroke-width="3"/>
  <circle cx="696" cy="398" r="13" fill="#100304"/>
  <circle cx="728" cy="402" r="13" fill="#100304"/>
  <path d="M712 346 l-5 -8 h10 z" fill="#e8eef4" transform="translate(0 4)"/>
  <text x="712" y="476" fill="#6b7c8d" font-size="12" text-anchor="middle">click Pair → scan the QR</text>
</svg>
